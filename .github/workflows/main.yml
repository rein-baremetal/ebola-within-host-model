name: build-and-reproduce

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: pip install numpy pillow
      - name: Build engine and adaptive driver
        run: |
          g++ -std=c++20 -O2 -pthread -Wall -Wextra code_annotated.cpp -o engine
          g++ -std=c++20 -O2 rpt_adapt.cpp -o rpt_adapt
      - name: RK4 self-test
        run: ./engine --selftest input.txt | tee selftest.txt && grep -q PASS selftest.txt
      - name: Determinism (identical SHA-256 on 1 and 4 threads)
        run: bash ./check_determinism.sh
      - name: Sanitisers (ASan + UBSan)
        run: bash ./check_sanitisers.sh
      - name: Threshold check (seven digits)
        run: python3 verify_threshold.py input.txt
      - name: Claims and language check
        run: python3 claims_check.py

  figures:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-dejavu-core
          pip install numpy pillow
      - name: Rebuild engine, figures, checks and docx
        run: bash ./run_all.sh
      - name: Upload regenerated outputs
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-figures-and-docx
          path: |
            fig*.svg
            screen_*.svg
            sample_*.svg
            figure_data/
            screen_report.txt
            Rein_Persistence_Theory_EBOV_Nyachio_Final.docx

  android:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK (engine compiled with the NDK)
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RPT-EBOV-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
